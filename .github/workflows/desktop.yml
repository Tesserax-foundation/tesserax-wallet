# Builds the desktop application for macOS (Apple silicon and Intel), Windows and Linux, and
# attaches the installers to a draft release of the tag.
#
# The wallet reads its defaults from the repository variables VITE_NODE_URL, VITE_NETWORK,
# VITE_EXPLORER_URL, VITE_EXPLORER_SUPABASE_URL and VITE_EXPLORER_SUPABASE_KEY.

name: Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      VITE_NODE_URL: ${{ vars.VITE_NODE_URL }}
      VITE_NETWORK: ${{ vars.VITE_NETWORK }}
      VITE_EXPLORER_URL: ${{ vars.VITE_EXPLORER_URL }}
      VITE_EXPLORER_SUPABASE_URL: ${{ vars.VITE_EXPLORER_SUPABASE_URL }}
      VITE_EXPLORER_SUPABASE_KEY: ${{ vars.VITE_EXPLORER_SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Tesserax Wallet ${{ github.ref_name }}
          releaseBody: Installers of Tesserax Wallet for the desktop.
          releaseDraft: true
          args: --target ${{ matrix.target }}
